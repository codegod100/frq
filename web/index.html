<!DOCTYPE html>
<html>
<head>
  <!--
    The whole page. Nothing generates it and nothing rewrites it: `just
    build web` copies this directory beside the compiled `frq.js`, and that
    is the bundle.
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="freeq client">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="frq">
  <link rel="apple-touch-icon" href="icons/frq-icon-192-v2.png">

  <link rel="icon" type="image/png" href="frq-favicon-v2.png"/>

  <!-- The browser chrome around an installed window, matching the dark
       palette's background in `nim/kit/frqkit/theme.nim`. -->
  <meta name="theme-color" content="#202833">

  <title>frq</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Installable, and ours rather than Flutter's.

    A browser offers to install a page only when it has a service worker
    with a fetch handler, so a PWA needs one -- and not an offline-first
    one, which is what held deploys back while this page was Flutter's: a
    new copy of it waited for every tab on the origin to close before it
    took over.

    `frq_sw.js` is network-first and claims its clients immediately. See
    that file for what it does and does not promise.

    Registered after load, so it never competes with the app for the
    connection on a first visit.
  -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("frq_sw.js")
          .catch(function () { /* a page that will not install still runs */ });
      });
    }
  </script>

  <!--
    TweetNaCl 1.0.3, `nacl-fast.min.js` from the npm tarball, unmodified
    (sha256 3ec535c004aeeb225785d8e93fb33bf99f52e399bd7dfc01969b5629baea5131).
    The core signs with it: WebCrypto's Ed25519 is a Promise, and a signature
    here is wanted on the line being sent. Before the core, so the key it
    mints at sign-in is a real one — see nim/web/frq/crypto.nim.
  -->
  <script src="nacl-fast.min.js"></script>
</head>
<body>
  <!--
    The app, and the half of the web build that owns the I/O, at the end of
    the body and none of them `async`. `frq.js` is the core and its renderer,
    compiled by `nim js`: it needs a body to put the window in, and it
    defines `globalThis.frq`, which `frq_host.js` reaches for the moment it
    runs.

    `frq_dpop.js` is a WebCrypto helper: ES256 keys, DPoP proofs, PKCE.
    `frq_oauth.js` is the flow that uses it, which this page needs because
    freeq's broker will only redirect back to loopback or its own origins —
    and this is neither.
  -->
  <script src="frq.js"></script>
  <script src="frq_dpop.js"></script>
  <script src="frq_oauth.js"></script>
  <script src="frq_host.js"></script>
</body>
</html>
