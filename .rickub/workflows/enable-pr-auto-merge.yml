name: Enable pull request auto-merge

# Rickub reads .rickub/workflows in preference to .github/workflows.  This
# workflow deliberately does not check out or run pull-request code: it only
# asks the forge to enable its native auto-merge, which waits for the branch's
# required approvals and status checks.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    # Fork workflows have a read-only token, so only repository branches can
    # request an automatic merge.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    steps:
      - name: Queue squash auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.graphql(
                `mutation EnableAutoMerge($pullRequestId: ID!) {
                  enablePullRequestAutoMerge(input: {
                    pullRequestId: $pullRequestId,
                    mergeMethod: SQUASH
                  }) {
                    pullRequest { number }
                  }
                }`,
                { pullRequestId: context.payload.pull_request.node_id },
              );
            } catch (error) {
              const messages = (error.errors || []).map(({ message }) => message);
              if (messages.some((message) => message.includes('unstable status'))) {
                core.notice(
                  'Auto-merge was not queued because this pull request has failing checks.',
                );
                return;
              }
              throw error;
            }
