[container]
name        = "frq"
description = "the cosmic desktop bundle, from a pinned toolchain"
# `debian:13-slim` and not `arch-nix`: there is no nix in this container any
# more, and the AppImage it used to build is gone with it. What this assembles
# is a directory — a jolt binary, the native objects, the source and a
# launcher — and what it owes that is curl, git, tar, a C compiler and
# openh264's headers.
#
# The reason this could stop being a nix build is not that nix was doing it
# badly. It is that everything it was building from source is now published as
# something a machine without nix can use: jolt as one statically-linked
# binary, the backends as jolt-native's `portable` tarball (RUNPATH $ORIGIN,
# NEEDED closure alongside), libmoq_ffi as an upstream release object. What
# was left was a Mesa and a nixGL to put the host driver in front of it —
# and not carrying a Mesa is what means not needing a nixGL.
registry    = "debian:13-slim"
# A Sandbox, not a Function: it runs on a real VM and the command is the
# sandbox's own process, so it dies when the command does.
runtime     = "sandbox"

[build]
# The container lives inside the repo it builds, so the copy is rooted two
# levels up and `.` is the whole tree -- uncommitted edits included, which is
# the point of copying rather than fetching.
context = "../.."
include = ["."]
# One apt line, where there used to be a nix store to populate. gcc and
# pkg-config for `c/frq_h264.c`, which is the only thing here that compiles;
# libopenh264-dev for its header and link; libopus and libasound because the
# bundle carries them out to the machine that runs it. patchelf to set
# $ORIGIN on the objects that arrive without it. git for the two pinned source
# checkouts, ca-certificates so curl can verify what it fetches.
setup = [
  "apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git gcc libc6-dev pkg-config libopenh264-dev libopus-dev libasound2-dev patchelf rsync tar xz-utils && rm -rf /var/lib/apt/lists/*",
]
# The build state a local checkout carries, wanted by nothing out here.
ignore  = [
    "flutter/build", "flutter/.home", "flutter/.dart_tool",
    "flutter/.clojuredart", "flutter/.cpcache", "flutter/lib/cljd-out",
    # The toolchains, which live on the volume out here.
    ".toolchain", ".toolchain-desktop",
    ".jolt", ".cpcache", "result", "build", ".git",
    # An editor's linter rewrites this while the upload is reading it, and
    # Modal fails the whole run with "was modified during build process".
    ".clj-kondo",
]

# `devshell` and not `nix-cache`, which went with nix — the same volume every
# other container's working state lives on, under a directory named for this
# one. The toolchain is what makes a second run cheap now: ~30MB of jolt and
# objects fetched once and found there afterwards.
[volumes]
devshell = "/devshell"

[resources]
# Four, not eight: nothing here compiles except one .c file. What this job
# spends its time on is fetching and copying.
cpu     = 4
memory  = 8192
# Minutes, not an hour. The old timeout was sized for libjoltcosmic's
# dependency tree, which is now somebody else's pipeline's problem.
timeout = 900

[run]
workdir = "/app"
# Source in, toolchain out of the volume, assemble, tar. The old command was a
# `nix build` of a closure with ~200 store paths in it, a substituter test to
# decide whether writing the cache back was worth it, and a copy of the
# AppImage into the volume. This is four steps and none of them evaluates
# anything.
command = """
set -e
BUILD_DIR=/devshell/frq-desktop

# Beside the working tree and NOT inside it: the rsync below runs with
# --delete, so anything under $BUILD_DIR that is not in /app is removed on
# every run. A toolchain kept in there would be deleted moments before it was
# consulted.
export FRQ_DESKTOP_TOOLCHAIN=/devshell/frq-desktop.toolchain
mkdir -p "$BUILD_DIR" "$FRQ_DESKTOP_TOOLCHAIN" /devshell/artifacts

echo "sync: /app -> $BUILD_DIR"
rsync -a --checksum --delete \
    --exclude '.toolchain/' \
    --exclude '.toolchain-desktop/' \
    --exclude '.git' \
    /app/ "$BUILD_DIR/"

cd "$BUILD_DIR"
[ -d "$FRQ_DESKTOP_TOOLCHAIN/jolt" ] && echo "  carried over: the toolchain"

# The same script `just desktop` runs, and the same single action: what a
# laptop assembles and what this ships are the same directory.
tools/build-desktop.sh tar

# Where the runner fetches it from, the way the AppImage was left in the
# nix-cache volume before. One file, already a squashed tree.
cp -L build/frq-desktop-x86_64-linux.tar.gz /devshell/artifacts/
ls -la /devshell/artifacts/frq-desktop-x86_64-linux.tar.gz
"""
# Set here rather than in the command so a shell into this container gets them
# too. FRQ_JOLT_NATIVE_SHA is the one pin the script will not invent: until
# jolt-native's pipeline has published a portable tarball for the revision
# tools/desktop-toolchain.sh names, this container fails fast and says so.
env     = { FRQ_DESKTOP_TOOLCHAIN = "/devshell/frq-desktop.toolchain" }
