[container]
name        = "frq-dev"
description = "the GTK desktop build, incremental, from a pinned Nim toolchain"
# `debian:13-slim` and not `arch-nix`: there is no nix in this container any
# more, and no flake left in the tree for it to enter. The build is
# `just build desktop`, which gets Nim out of `tools/toolchain.sh` by pinned
# sha256 -- so what the image owes it is a C compiler, OpenSSL and the GTK 3
# headers nimkit's backend compiles against, and nothing else.
registry    = "debian:13-slim"
# A Sandbox, not a Function: runs on a real VM, and the command is
# the sandbox's own process so it dies when the command does.
runtime     = "sandbox"

[build]
# The container lives inside the repo it builds, so the copy is rooted two
# levels up and `.` is the whole tree.
context = "../.."
include = ["."]
# The whole image build, and it is one apt line. What used to be here -- a nix
# store to populate and a devShell to print into /etc/devshell.sh, so that a
# shell attached to this container *was* the devShell -- is gone with the nix
# it was for. The toolchain script now plays that part, and it lives on the
# volume rather than in a layer.
#
# The first half is what the repository environment needs: tar and xz-utils
# for Nim's `.tar.xz`; ca-certificates so curl can verify what it fetches;
# git, so an attached shell can see what it is building; rsync for the sync
# below. `just` is the repository's task runner, while Python and Node drive
# the web relay and the `just test web` suite. Keeping those here means an
# attached development shell can run the same commands documented at the root
# instead of having to reconstruct CI's host.
#
# The second half is the desktop target: a C toolchain, because `nim c`
# shells out to one; pkg-config and GTK 3's headers, which is where nimkit's
# GTK backend takes its flags from. libssl is Nim's: nim.cfg is `-d:ssl`, and
# std/net resolves -lssl and -lcrypto through dynlib at run time.
setup = [
  "apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git just nodejs python3 rsync tar xz-utils && rm -rf /var/lib/apt/lists/*",
  "apt-get update && apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libssl-dev && rm -rf /var/lib/apt/lists/*",
]
# The build state a local checkout carries, uploaded on every start and
# wanted by nothing out there: the container builds into a volume of its own,
# and a laptop's output is that laptop's.
ignore  = [
    # The toolchain, which lives on the volume out here.
    ".toolchain",
    "build", "nim/nimcache", ".git",
    ".cpcache", "result",
]

# One volume now, where there were two: the nix binary cache went with nix.
# `devshell` is the working state of an incremental loop, shared by every
# container that has one -- each gets its own directory under it, named for
# what it belongs to, so two containers never write the
# same tree. Modal Volumes have no locking, so those directory names are the
# only thing keeping them apart, and two runs of the *same* container must not
# overlap.
[volumes]
devshell = "/devshell"

[resources]
cpu     = 8
memory  = 16384
timeout = 3600

[run]
workdir = "/app"
# Source in, toolchain out of the volume, build in place. None of it
# evaluates anything: the old command spent its first minutes entering a
# devShell, printing an environment, caching that environment against
# flake.lock and copying a nix closure back afterwards, all to arrive at a
# PATH. A PATH is what `tools/toolchain.sh env` prints, out of a directory
# already on the volume.
#
# An incremental build is the point, and `nix build` could not give one: a
# derivation is all-or-nothing, so any edit is a fresh sandbox and a fresh
# compile of everything. Here the toolchain supplies the compiler and Nim's
# own cache decides what is stale -- which is the whole reason
# `just build desktop` exists as the working-tree loop.
command = """
set -e
SHELL_DIR=/devshell/frq-desktop

# Beside the working tree and NOT inside it: the rsync below runs with
# --delete, so anything under $SHELL_DIR that is not in /app is removed on
# every run. A cache kept in there would be deleted moments before it was
# consulted.
export FRQ_TOOLCHAIN=/devshell/frq-desktop.toolchain
mkdir -p "$SHELL_DIR" "$FRQ_TOOLCHAIN"

echo "sync: /app -> $SHELL_DIR"
# rsync and not cp, with --checksum and not mtimes: Modal copies the source in
# with fresh timestamps every run, so a plain copy looks entirely new to
# the build and rebuilds the lot. --checksum compares content and leaves the
# unchanged files' timestamps alone, which is the whole basis of the
# incremental build.
#
# The excludes are the state we are here to keep -- overwriting them from /app
# would defeat the volume.
rsync -a --checksum --delete \
    --exclude '/build/' \
    --exclude '.toolchain/' \
    --exclude '.git' \
    /app/ "$SHELL_DIR/"

cd "$SHELL_DIR"
# What survived from the last run, by presence and not by size: `du` here
# would walk the toolchain and every object of the last build over a network
# volume, for numbers nobody acts on.
for d in "$FRQ_TOOLCHAIN" "$XDG_CACHE_HOME/nim" build; do
    [ -d "$d" ] && echo "  carried over: $d"
done

# Run from the volume, where the state it reuses lives. Use the public recipe
# rather than carrying a second inlined copy here; an attached shell has the
# same `just` and can reproduce this exact build command. One binary, with
# the core linked in: there is no library for it to load.
just build desktop

echo "built:"
ls -la build/frq
"""
# Nim keeps its compile cache under XDG_CACHE_HOME (`nim` in there), which
# points into the volume so a second run finds the C the first one generated.
# Set here rather than in the command so a shell into this container gets
# them too.
env     = { XDG_CACHE_HOME = "/devshell/frq-desktop.toolchain/.cache", FRQ_TOOLCHAIN = "/devshell/frq-desktop.toolchain" }
