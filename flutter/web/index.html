<!DOCTYPE html>
<html>
<head>
  <!--
    Committed rather than generated. `just flutter-web` used to run
    `flutter create --platforms=web` when this directory was missing, which
    was fine while the page was Flutter's default one — but the OAuth client
    needs a script of its own beside the bundle, and a generated runner is no
    place to keep one.

    `$FLUTTER_BASE_HREF` is the token `flutter build web` rewrites; leave it.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="freeq client">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="frq">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon-frq.png"/>

  <!-- The browser chrome around an installed window, matching `nim_theme.bg`
       rather than the blue the Flutter template shipped. -->
  <meta name="theme-color" content="#202833">

  <title>frq</title>
  <link rel="manifest" href="manifest.json">

  <!--
    The core, and the half of the web build that owns the I/O. Both before
    the bundle and neither `async`: Flutter reaches `globalThis.frq` as soon
    as it starts, and a core that might not have parsed yet is a race nobody
    would enjoy debugging.

    `frq_dpop.js` is the same WebCrypto helper the ClojureDart build loaded,
    unchanged: ES256 keys, DPoP proofs, PKCE. `frq_oauth.js` is the flow that
    uses it, which this page needs because freeq's broker will only redirect
    back to loopback or its own origins — and this is neither.
  -->
  <!--
    Installable, and ours rather than Flutter's.

    A browser offers to install a page only when it has a service worker
    with a fetch handler, so a PWA needs one -- and the bundle is still
    built `--pwa-strategy=none`, because the worker Flutter ships is the one
    that held deploys back: offline-first, and a new copy of it waits for
    every tab on the origin to close before it takes over.

    `frq_sw.js` is network-first and claims its clients immediately. See
    that file for what it does and does not promise.

    Registered after load, so it never competes with the bundle for the
    connection on a first visit.
  -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("frq_sw.js")
          .catch(function () { /* a page that will not install still runs */ });
      });
    }
  </script>

  <script src="frq_core.js"></script>
  <script src="frq_dpop.js"></script>
  <script src="frq_oauth.js"></script>
  <script src="frq_host.js"></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
