<!DOCTYPE html>
<html>
<head>
  <!--
    Committed rather than generated. `just flutter-web` used to run
    `flutter create --platforms=web` when this directory was missing, which
    was fine while the page was Flutter's default one — but the OAuth client
    needs a script of its own beside the bundle, and a generated runner is no
    place to keep one.

    `$FLUTTER_BASE_HREF` is the token `flutter build web` rewrites; leave it.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="freeq client">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="frq">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>frq</title>
  <link rel="manifest" href="manifest.json">

  <!--
    The core, and the half of the web build that owns the I/O. Both before
    the bundle and neither `async`: Flutter reaches `globalThis.frq` as soon
    as it starts, and a core that might not have parsed yet is a race nobody
    would enjoy debugging.

    `frq_dpop.js` is the same WebCrypto helper the ClojureDart build loaded,
    unchanged: ES256 keys, DPoP proofs, PKCE. `frq_oauth.js` is the flow that
    uses it, which this page needs because freeq's broker will only redirect
    back to loopback or its own origins — and this is neither.
  -->
  <!--
    No service worker, and no leftovers of one.

    The bundle is built `--pwa-strategy=none`, so nothing here registers
    one any more. That settles a new visitor, but not a browser that
    installed one before: `none` still emits `flutter_service_worker.js` as
    an empty file, so the old worker is replaced by a no-op rather than
    removed, and a no-op registration is still a registration.

    This removes it. The app is a window onto a live IRC connection and has
    no offline worth the name, so nothing is lost with the caches -- and
    what they cost was a deploy that would not arrive: a new worker waits
    until every tab on the origin is closed, so reloading went on serving
    the previous bundle and the cure was clearing the site data by hand.
  -->
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(function (rs) { rs.forEach(function (r) { r.unregister(); }); })
        .catch(function () { /* nothing to undo */ });
    }
    if (window.caches && caches.keys) {
      caches.keys()
        .then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); })
        .catch(function () { /* nothing to undo */ });
    }
  </script>

  <script src="frq_core.js"></script>
  <script src="frq_dpop.js"></script>
  <script src="frq_oauth.js"></script>
  <script src="frq_host.js"></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
