name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/frq-web
        run: |
          set -euo pipefail
          image="${IMAGE_REPOSITORY}:${GITHUB_SHA}"
          docker build -f .modal/web/Dockerfile -t "$image" .
          docker push "$image"
          echo "image=$image" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: image
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Modal
        run: python -m pip install --quiet modal
      - name: Deploy
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          FRQ_WEB_IMAGE: ${{ needs.image.outputs.image }}
        run: modal deploy .modal/web/deploy.py
