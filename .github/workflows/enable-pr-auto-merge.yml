name: Enable pull request auto-merge

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

# This workflow does not check out or run pull-request code. Its only job is
# to queue the PR for GitHub's native auto-merge, which waits for the branch's
# required reviews and status checks before merging.
#
# That only works because main requires the `test` check (a ruleset, not a
# file here). Without a required check, the one pending check on a new PR is
# this job itself: GitHub calls the PR "unstable" for it and refuses to queue
# auto-merge, so the job waits on itself and never gets anywhere.
permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    # Only branches pushed to this repository. pull_request_target fires for
    # forks as well, and a fork's PR that passed `test` would otherwise merge
    # itself and deploy.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Queue auto-merge
        uses: actions/github-script@v7
        with:
          script: |
            await github.graphql(
              `mutation EnableAutoMerge($pullRequestId: ID!) {
                enablePullRequestAutoMerge(input: {
                  pullRequestId: $pullRequestId,
                  mergeMethod: SQUASH
                }) {
                  pullRequest { number }
                }
              }`,
              { pullRequestId: context.payload.pull_request.node_id },
            );
