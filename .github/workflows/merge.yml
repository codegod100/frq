name: Merge and deploy

on:
  workflow_run:
    workflows: [Test]
    types: [completed]

# A pull request merges itself once `test` passes on it, and then deploys.
#
# This used to queue GitHub's native auto-merge instead, and every merge it
# made reached main without a deploy. It was queued with the workflow's own
# GITHUB_TOKEN, so the merge was that token's doing too, and GitHub starts no
# workflow for an event that token causes: the push to main came and went and
# `deploy.yml` never heard of it. `workflow_dispatch` is the one door that
# token may open, so this job merges and then knocks on it.
#
# `workflow_run` runs this file as it is on main, never a pull request's copy,
# and it checks out nothing: the pull request's code is only ever built by
# `test` and, once merged, by the deploy.
permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  merge:
    # Only branches pushed to this repository. A fork's pull request that
    # passed `test` would otherwise merge itself and deploy.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Merge, then deploy main
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;

            // The pull request whose head is still the commit that passed. A
            // push since then has its own `test` run coming, and that run
            // decides instead.
            const { data: prs } =
              await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: run.head_sha,
              });
            const pr = prs.find((p) =>
              p.state === 'open' && !p.draft &&
              p.base.ref === 'main' &&
              p.head.ref === run.head_branch &&
              p.head.sha === run.head_sha);
            if (!pr) {
              core.info(`No open, ready pull request is at ${run.head_sha}.`);
              return;
            }

            // `sha` makes the merge refuse if the head moved after all, and
            // main's ruleset still has the last word on whether it may land.
            await github.rest.pulls.merge({
              owner, repo,
              pull_number: pr.number,
              sha: run.head_sha,
              merge_method: 'squash',
            });
            core.info(`Merged #${pr.number}.`);

            await github.rest.actions.createWorkflowDispatch({
              owner, repo, workflow_id: 'deploy.yml', ref: 'main',
            });
            core.info('Dispatched deploy.yml on main.');
