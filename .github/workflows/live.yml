# The whole stack against the real freeq, signed in as the test account.
#
# Here rather than in .rickub/workflows/build.yml because the account's app
# password is a GitHub secret — `tools/set-test-account-github-secrets` puts it
# there — and rickub cannot read one. The other suites stay on rickub.
#
# It talks to production: an app-password sign-in at the account's PDS, SASL
# at irc.freeq.at, and one line sent to #test, which is how the harness
# checks that freeq saw the account. That line is why this
# runs when asked for and on main rather than on every push to every branch.
#
# Toolchains by sha256, as build.yml does it; the same versions and hashes.

name: live

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      room:
        description: "Room to join and read, e.g. #freeq-dev (empty: the first in the list)"
        required: false
        default: ""
      trace:
        description: "Print the IRC lines about that room (never AUTHENTICATE)"
        type: boolean
        required: false
        default: false

# One sign-in at a time: two runs as one account are two clients with one
# nick, and the second is the one that gets renamed.
concurrency:
  group: live-freeq
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  signed-in:
    runs-on: ubuntu-latest
    env:
      NIM_VERSION: "2.2.10"
      NIM_SHA256: "0a3a38752e97e9d44aa479b3a7b37336dfe0176daf22ee5b5218ad0991ecd211"
      DART_VERSION: "3.13.4"
      DART_SHA256: "6487a10df5eab890d746d14a55f4c70bec3c1c0633f51804eb504cbc0fc395bb"
    steps:
      - uses: actions/checkout@v4

      - name: OpenSSL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev libssl3

      - name: Nim ${{ env.NIM_VERSION }}
        run: |
          set -euo pipefail
          url="https://nim-lang.org/download/nim-${NIM_VERSION}-linux_x64.tar.xz"
          curl -fsSL -o /tmp/nim.tar.xz "$url"
          echo "${NIM_SHA256}  /tmp/nim.tar.xz" | sha256sum -c -
          mkdir -p /opt/nim && tar -xJf /tmp/nim.tar.xz -C /opt/nim --strip-components=1
          echo "/opt/nim/bin" >> "$GITHUB_PATH"

      - name: Dart ${{ env.DART_VERSION }}
        run: |
          set -euo pipefail
          url="https://storage.googleapis.com/dart-archive/channels/stable/release/${DART_VERSION}/sdk/dartsdk-linux-x64-release.zip"
          curl -fsSL -o /tmp/dart.zip "$url"
          echo "${DART_SHA256}  /tmp/dart.zip" | sha256sum -c -
          sudo unzip -q /tmp/dart.zip -d /opt
          echo "/opt/dart-sdk/bin" >> "$GITHUB_PATH"

      - name: Build libfrqcore.so
        run: |
          cd nim && nim c --app:lib --mm:orc -d:release --hints:off --path:src \
            --out:../build/nim/libfrqcore.so src/frq_core.nim

      - name: Signed in, end to end
        env:
          FRQ_TEST_HANDLE: ${{ secrets.FRQ_TEST_HANDLE }}
          FRQ_TEST_APP_PASSWORD: ${{ secrets.FRQ_TEST_APP_PASSWORD }}
          FRQ_TEST_ROOM: ${{ inputs.room }}
          TRACE: ${{ inputs.trace }}
        run: |
          set -euo pipefail
          # Without both the harness connects as a guest and passes, which is
          # not what this job is for.
          if [ -z "$FRQ_TEST_HANDLE" ] || [ -z "$FRQ_TEST_APP_PASSWORD" ]; then
            echo "::error::FRQ_TEST_HANDLE and FRQ_TEST_APP_PASSWORD are not set;" \
                 "run tools/set-test-account-github-secrets"
            exit 1
          fi
          cd dart/frq_core && dart pub get >/dev/null
          if [ "$TRACE" != "true" ] || [ -z "$FRQ_TEST_ROOM" ]; then
            dart run tool/live_ui.dart
            exit 0
          fi
          # The whole trace carries the SASL payload, which a public log must
          # not; only the lines about the room (and the batches they come
          # in) are printed, and never an AUTHENTICATE.
          status=0
          FRQ_TRACE=1 dart run tool/live_ui.dart 2>/tmp/trace.log || status=$?
          echo "--- IRC lines for $FRQ_TEST_ROOM ---"
          grep -v AUTHENTICATE /tmp/trace.log \
            | grep -iF -e "$FRQ_TEST_ROOM" -e ' BATCH ' -e 'batch=' \
            | cut -c1-400 || true
          exit $status
